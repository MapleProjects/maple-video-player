[package]
name = "maple-player"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.31"
libmpv2 = { version = "6.0.0", features = ["render"] }
glow = "0.16"
rfd = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
